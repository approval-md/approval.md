version: "0.1"

defaults:
  autonomy: manual          # anything not named below needs sign-off
  approval_ttl: "24h"
  on_expiry: reject

classes:
  # from: Read files, list directories, search the repo
  read.*: { autonomy: autonomous }
  # from: Edit source, tests, fixtures, and Backlog.md task files
  files.write.workspace: { autonomy: autonomous }
  # from: Run tests, lint, typecheck, build; `node`/`tsx` scripts inside the repo
  exec.local: { autonomy: autonomous }
  # from: Local git: status, diff, add, commit on feature branches
  vcs.commit.branch: { autonomy: autonomous }
  # from: `git push`, merges to `main`, tag creation
  vcs.push: { autonomy: manual }
  # from: `npm publish`, `npm version`, any registry interaction
  release.publish: { autonomy: manual }
  # from: Adding or upgrading dependencies
  deps.add: { autonomy: manual }
  # from: Deleting files outside the current task's stated scope
  data.delete: { autonomy: manual }
  # from: Any network call beyond package installs (API calls, webhooks, sends)
  network.call: { autonomy: manual }
  # from: Edits to `APPROVAL.md`, `.approval/`, `CLAUDE.md`, or CI/release config
  policy.edit: { autonomy: manual }
  # never: Touch credentials, tokens, or the vault
  account.credential: { autonomy: manual }
  # never: Rewrite git history on shared branches
  vcs.history.rewrite: { autonomy: manual }

