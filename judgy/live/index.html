<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>judgy live</title>
<meta name="description" content="A live feed of proposed agent actions: the action on the left, the reviewer's recommendation and the runtime's authorization in the middle, the human's decision on the right.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,0..100;1,9..144,400..700,0..100&family=IBM+Plex+Mono:wght@400;500&family=JetBrains+Mono:wght@700&family=Instrument+Sans:wght@400..600&display=swap">
<style>
:root {
  --fog: #F2F4F7;
  --surface: #FFFFFF;
  --ink: #161B26;
  --muted: #6B7382;
  --line: #D9DEE7;

  --c-model: #5B45D6;
  --c-runtime: #0E7A76;
  --c-human: #B3651B;
  --c-effect: #556072;
  --c-evidence: #8A93A3;

  --diff-add: #0E7A76;
  --diff-del: #B3651B;
  --diff-add-bg: rgba(14, 122, 118, 0.08);
  --diff-del-bg: rgba(179, 101, 27, 0.08);

  /* The new-row wash: the model lane colour at 8%. A new row is a proposal,
     which is a model act, so the whole row washes in one lane colour. */
  --wash-model: rgba(91, 69, 214, 0.08);

  --serif: "Fraunces", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --fog: #12161F;
    --surface: #1A2030;
    --ink: #E8EBF0;
    --muted: #98A1B3;
    --line: #2B3446;

    --c-model: #8473E0;
    --c-runtime: #4A9B98;
    --c-human: #C68B54;
    --c-effect: #7F8895;
    --c-evidence: #A7AEBA;

    --diff-add: #4A9B98;
    --diff-del: #C68B54;
    --diff-add-bg: rgba(74, 155, 152, 0.12);
    --diff-del-bg: rgba(198, 139, 84, 0.12);

    --wash-model: rgba(132, 115, 224, 0.10);
  }
}

* { box-sizing: border-box; }

[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--fog);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  font-synthesis-weight: none;
}

.page {
  max-width: 1080px;
  margin: 0 auto;
  padding-left: 20px;
  padding-right: 20px;
  padding-block: 24px 44px;
}

a {
  color: inherit;
  text-decoration: underline;
  text-underline-offset: 2px;
  text-decoration-thickness: 1px;
  text-decoration-color: var(--line);
}
a:hover { text-decoration-color: currentColor; }

:focus-visible {
  outline: 2px solid var(--c-model);
  outline-offset: 2px;
  border-radius: 2px;
}

h1, h2, h3 { font-family: var(--serif); font-weight: 500; margin: 0; }

.wordmark {
  font-size: 32px;
  line-height: 1.05;
  letter-spacing: -0.015em;
  font-weight: 600;
  font-variation-settings: "SOFT" 60;
  margin: 0 0 2px;
}

.wordmark .live-word {
  font-style: italic;
  font-weight: 400;
  font-size: 22px;
  letter-spacing: 0;
  color: var(--muted);
  margin-left: 7px;
}

.mono {
  font-family: var(--mono);
  font-size: 12px;
  overflow-wrap: anywhere;
}

.muted { color: var(--muted); }

/* ---------- chips ---------- */

.chip {
  display: inline-block;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0 6px;
  font-family: var(--sans);
  font-size: 11px;
  line-height: 1.6;
  color: var(--muted);
  background: transparent;
  white-space: nowrap;
}

.chip-prov { border-style: dotted; border-width: 1px; }

/* ---------- status strip ---------- */

.strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
  overflow: hidden;
  margin: 0 0 6px;
}

.strip-cell {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  align-items: baseline;
  padding: 5px 10px;
  border-left: 1px solid var(--line);
  min-width: 0;
}
.strip-cell:first-child { border-left: 0; }

.strip-key {
  font-family: var(--serif);
  font-style: italic;
  font-size: 13px;
  color: var(--muted);
}

.strip-val {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  align-items: baseline;
  font-size: 13px;
  min-width: 0;
}

.strip-val .id { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }

.toggle {
  font-family: var(--sans);
  font-size: 12px;
  line-height: 1.5;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0 8px;
  cursor: pointer;
}
.toggle:hover { border-color: var(--muted); }

@media (max-width: 619px) {
  .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .strip-cell:nth-child(odd) { border-left: 0; }
  .strip-cell:nth-child(n + 3) { border-top: 1px solid var(--line); }
}

/* ---------- provenance line ---------- */

.chiprow {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  align-items: baseline;
  margin: 0 0 6px;
  color: var(--muted);
  font-size: 13px;
}

.unreachable {
  border: 1px solid var(--c-human);
  border-radius: 6px;
  background: var(--surface);
  padding: 10px 12px;
  margin: 0 0 8px;
  font-size: 13px;
}

.unreachable h2 { font-size: 17px; color: var(--c-human); margin-bottom: 2px; }

.unreachable p { margin: 2px 0 0; }

.unreachable pre {
  margin: 6px 0 0;
  padding: 8px 10px;
  background: var(--fog);
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow-x: auto;
  font-family: var(--mono);
  font-size: 12px;
}

/* ---------- the feed grid ---------- */

.feed {
  display: grid;
  grid-template-columns: 1.4fr 1fr 0.7fr;
  align-items: start;
  margin: 10px 0 0;
}

.head-cell {
  font-family: var(--serif);
  font-style: italic;
  font-size: 16px;
  line-height: 1.2;
  padding: 0 10px 4px;
}

.head-actions { color: var(--ink); padding-left: 10px; }
.head-judge { color: var(--c-model); }
.head-human { color: var(--c-human); }

.cell {
  border-top: 1px solid var(--line);
  padding: 7px 10px 9px;
  min-width: 0;
  overflow-wrap: anywhere;
}

.cell-action { border-left: 2px dashed var(--c-model); }
.cell-judge { border-left: 2px dashed var(--c-model); }
.cell-human { border-left: 6px double var(--c-human); }

/* One episode can hold several attempts, linked by `revises`. The line between
   two episodes is heavier than the line between two attempts of one episode. */
.row-ep-start > .cell { border-top-width: 2px; }

/* No human was needed: the cell keeps the row's hairline and nothing else, so
   an empty cell never reads as a lane that was used. */
.cell-human.cell-quiet { border-left: 0; padding-left: 16px; }
.cell-quiet .cell-lane { display: none; }

.cell-lane {
  display: none;
  font-family: var(--serif);
  font-style: italic;
  font-size: 13px;
  margin-bottom: 2px;
}
.cell-action .cell-lane { color: var(--ink); }
.cell-judge .cell-lane { color: var(--c-model); }
.cell-human .cell-lane { color: var(--c-human); }

/* ---------- action cell ---------- */

.act-verb {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 15px;
  line-height: 1.3;
}

.args { margin: 3px 0 0; display: flex; flex-direction: column; gap: 1px; }

.arg { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.arg .k { color: var(--muted); }
.arg .v { color: var(--ink); }

.arg-changed .v {
  color: var(--c-model);
  border-bottom: 2px solid var(--c-model);
  padding-bottom: 1px;
}

/* Worker-authored assertions. They are not evidence, and the chip says so. */
.claims { margin-top: 4px; }
.claims-head { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: baseline; font-size: 12px; color: var(--muted); }
.claim { font-family: var(--mono); font-size: 12px; color: var(--ink); overflow-wrap: anywhere; }

.revises { margin-top: 4px; font-size: 12px; color: var(--muted); }
.revises .id { font-family: var(--mono); font-size: 12px; }

.act-meta { margin-top: 4px; font-size: 12px; color: var(--muted); }
.act-ep { margin-top: 1px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.act-ts { margin-top: 1px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.act-trace { margin-top: 1px; font-family: var(--mono); font-size: 12px; }

/* The observed effect, the fourth authority: what actually happened. */
.effect {
  margin-top: 6px;
  padding-left: 8px;
  border-left: 5px solid var(--c-effect);
}

.effect-line { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: baseline; font-size: 12px; }
.effect-key { color: var(--muted); }
.effect-word { font-weight: 600; color: var(--c-effect); }
.effect-ref { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }

/* ---------- judge cell ---------- */

.verdict-line { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }

.verdict {
  font-family: var(--serif);
  font-size: 18px;
  line-height: 1.2;
  color: var(--c-model);
}

.raw { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }

.reason { margin: 2px 0 0; font-size: 13px; }

.cites { margin-top: 3px; font-size: 12px; color: var(--muted); }

.reviewer-version { margin-top: 2px; font-family: var(--mono); font-size: 12px; color: var(--muted); }

.runtime {
  margin-top: 6px;
  padding-top: 5px;
  padding-left: 8px;
  border-top: 1px solid var(--line);
  border-left: 2px solid var(--c-runtime);
}

/* The runtime was never consulted, so its lane is not drawn. */
.runtime-quiet { border-left: 0; padding-left: 0; color: var(--muted); font-size: 12px; }

.runtime-key { color: var(--muted); font-size: 13px; }

.runtime-word {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 13px;
  color: var(--c-runtime);
}

.runtime-rules { margin-top: 1px; font-family: var(--mono); font-size: 12px; color: var(--muted); }

.waiting { color: var(--muted); font-style: italic; font-size: 13px; }

/* ---------- human cell ---------- */

.human-status {
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.2;
  color: var(--c-human);
}

.human-line { margin-top: 2px; display: flex; flex-wrap: wrap; gap: 3px 6px; align-items: baseline; font-family: var(--mono); font-size: 12px; color: var(--muted); }

.human-chip { margin-top: 4px; }

/* ---------- new row wash ---------- */

@keyframes row-wash {
  from { background-color: var(--wash-model); }
  to { background-color: transparent; }
}

.row-new > .cell { animation: row-wash 250ms ease-out 1; }

/* ---------- stacked layout ---------- */

@media (max-width: 719px) {
  .feed { grid-template-columns: minmax(0, 1fr); }
  .head-cell { display: none; }
  .cell-lane { display: block; }
  .cell { padding: 7px 0 7px 10px; border-top: 0; }
  .cell-action { border-top: 1px solid var(--line); padding-top: 10px; }
  .cell-human { padding-bottom: 12px; }
  .row-ep-start > .cell { border-top: 0; }
  .row-ep-start > .cell-action { border-top: 2px solid var(--line); }
}

/* ---------- footer ---------- */

footer {
  margin-top: 24px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 13px;
}

footer p { margin: 0; }
/* approval.md wordmark, carried over from approval.md's own page: the o is a checked box. */
.amark { display: inline-flex; align-items: center; font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; letter-spacing: -.5px; color: var(--ink); text-decoration: none; }
.amark svg { height: .82em; width: auto; display: block; margin: 0 .02em; }
.amark .bx { fill: var(--ink); }
.amark .md { color: var(--muted); }
.amark:hover { color: #17A15E; }
.amark:hover .bx { fill: #17A15E; }
.for { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
.for .amark { font-size: 13px; vertical-align: -1px; }


@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div class="page">

  <header>
    <h1 class="wordmark">judgy<span class="live-word">live</span></h1>
    <p class="for">built on <a class="amark" href="https://approval.md" aria-label="approval.md">appr<svg viewBox="24 60 224 208" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><path class="bx" d="M 92 78 L 34 78 L 34 250 L 92 250 L 92 222 L 64 222 L 64 106 L 92 106 Z"/><path class="bx" d="M 142 78 L 200 78 L 200 250 L 142 250 L 142 222 L 170 222 L 170 106 L 142 106 Z"/><path d="M 74 176 L 116 220 L 232 80" fill="none" stroke="#17A15E" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/></svg>val<span class="md">.md</span></a>. <a href="../">Back to the case ledger</a></p>

    <div class="strip">
      <div class="strip-cell">
        <div class="strip-key">feed</div>
        <div class="strip-val" id="mode-val"></div>
      </div>
      <div class="strip-cell">
        <div class="strip-key">events</div>
        <div class="strip-val" id="count-val">0</div>
      </div>
      <div class="strip-cell">
        <div class="strip-key">last event</div>
        <div class="strip-val"><span class="id" id="last-val">none yet</span></div>
      </div>
      <div class="strip-cell">
        <div class="strip-key">polling</div>
        <div class="strip-val">
          <span id="poll-val">starting</span>
          <button type="button" class="toggle" id="toggle">Pause</button>
        </div>
      </div>
    </div>
  </header>

  <p class="chiprow" id="synthetic" hidden></p>

  <section class="unreachable" id="unreachable" hidden>
    <h2>Feed unreachable</h2>
    <p id="unreachable-detail"></p>
    <p class="muted">Serve the folder over http:</p>
    <pre>python3 -m http.server 8765 -d demo/site</pre>
  </section>

  <main>
    <div class="feed" id="feed">
      <div class="head-cell head-actions">actions</div>
      <div class="head-cell head-judge">judge</div>
      <div class="head-cell head-human">human</div>
    </div>
    <p class="waiting" id="empty">Waiting for the first event.</p>
  </main>

  <footer>
    <p>Renders <span class="mono">data/live/feed.json</span> as written.</p>
  </footer>

</div>

<script>
(function () {
  "use strict";

  /* This page is a pure renderer. It never decides a verdict, an authorization,
     a human decision or an effect; it reads them from the feed document and
     shows them, each in its own lane. The only computation is presentational:
     casing, a diff of two arg objects so a revision shows what changed, and the
     episode grouping of rows. */

  var FEED_URL = "../data/live/feed.json";
  var POLL_MS = 1000;

  var PROVENANCE = ["simulated", "replay", "not run", "not_run", "unavailable", "unknown"];

  var feedEl = document.getElementById("feed");
  var emptyEl = document.getElementById("empty");
  var syntheticEl = document.getElementById("synthetic");
  var unreachableEl = document.getElementById("unreachable");
  var unreachableDetailEl = document.getElementById("unreachable-detail");
  var modeValEl = document.getElementById("mode-val");
  var countValEl = document.getElementById("count-val");
  var lastValEl = document.getElementById("last-val");
  var pollValEl = document.getElementById("poll-val");
  var toggleEl = document.getElementById("toggle");

  var state = {
    feedId: null,
    lastSeq: 0,
    rows: {},
    order: [],
    firstRow: null,
    paused: false,
    timer: null
  };

  /* ---------- small dom helpers ---------- */

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) { node.className = cls; }
    if (text !== undefined && text !== null) { node.textContent = String(text); }
    return node;
  }

  function clear(node) {
    while (node.firstChild) { node.removeChild(node.firstChild); }
  }

  function isProvenance(value) {
    return PROVENANCE.indexOf(String(value)) !== -1;
  }

  function chip(value, label) {
    var node = el("span", "chip", label === undefined ? String(value) : String(label));
    if (isProvenance(value)) {
      node.className = "chip chip-prov";
      node.title = "provenance label from the data, not a measured result";
    }
    return node;
  }

  /* Presentational only: underscores become spaces, and an all-uppercase enum
     token is title-cased so it does not read as a shouted label. */
  function displayWord(raw) {
    var text = String(raw).replace(/_/g, " ");
    if (/^[A-Z][A-Z ]*$/.test(text)) {
      text = text.charAt(0) + text.slice(1).toLowerCase();
    }
    return text;
  }

  function capitalize(text) {
    return String(text).charAt(0).toUpperCase() + String(text).slice(1);
  }

  function differsBeyondCasing(word, raw) {
    return String(word).toLowerCase() !== String(raw).toLowerCase();
  }

  function formatValue(value) {
    if (value === null) { return "null"; }
    if (typeof value === "object") { return JSON.stringify(value); }
    return String(value);
  }

  /* ---------- action cell ---------- */

  /* Presentational diff of two arg objects: which keys a revision changed.
     It compares JSON, it does not judge anything. */
  function changedArgs(args, previousArgs) {
    var changed = [];
    if (!previousArgs) { return changed; }
    Object.keys(args || {}).forEach(function (key) {
      if (formatValue(args[key]) !== formatValue(previousArgs[key])) { changed.push(key); }
    });
    return changed;
  }

  function claimsBlock(claims) {
    var wrap = el("div", "claims");
    var head = el("div", "claims-head");
    head.appendChild(el("span", null, "claims:"));
    head.appendChild(chip("untrusted"));
    wrap.appendChild(head);
    claims.forEach(function (claim) {
      wrap.appendChild(el("div", "claim", formatValue(claim)));
    });
    return wrap;
  }

  /* The observed effect of the action: what the environment reports happened.
     It is its own authority, never inferred from the verdict. */
  function effectBlock(event) {
    var wrap = el("div", "effect");
    var line = el("div", "effect-line");
    line.appendChild(el("span", "effect-key", "ran:"));
    line.appendChild(el("span", "effect-word", displayWord(event.outcome)));
    if (event.simulated === true) { line.appendChild(chip("simulated")); }
    wrap.appendChild(line);
    (event.artifact_refs || []).forEach(function (ref) {
      wrap.appendChild(el("div", "effect-ref", formatValue(ref)));
    });
    return wrap;
  }

  function renderAction(cell, event, previousArgs, effectEvent) {
    clear(cell);
    cell.appendChild(el("div", "cell-lane", "action"));

    if (!event) {
      cell.appendChild(el("div", "waiting", "waiting for the action"));
      return;
    }

    cell.appendChild(el("div", "act-verb", String(event.action)));

    var args = event.args || {};
    var changed = event.revises ? changedArgs(args, previousArgs) : [];
    var argsWrap = el("div", "args");
    Object.keys(args).forEach(function (key) {
      var isChanged = changed.indexOf(key) !== -1;
      var item = el("div", isChanged ? "arg arg-changed" : "arg");
      item.appendChild(el("span", "k", key + ": "));
      item.appendChild(el("span", "v", formatValue(args[key])));
      argsWrap.appendChild(item);
    });
    cell.appendChild(argsWrap);

    if (Array.isArray(event.claims) && event.claims.length) {
      cell.appendChild(claimsBlock(event.claims));
    }

    if (event.revises) {
      var revises = el("div", "revises");
      revises.appendChild(document.createTextNode("revises "));
      revises.appendChild(el("span", "id", String(event.revises)));
      cell.appendChild(revises);
    }

    var meta = [];
    if (event.actor) { meta.push(String(event.actor)); }
    if (event.scenario) { meta.push(String(event.scenario)); }
    if (meta.length) { cell.appendChild(el("div", "act-meta", meta.join(", "))); }

    if (event.episode_id) { cell.appendChild(el("div", "act-ep", String(event.episode_id))); }

    cell.appendChild(el("div", "act-ts", String(event.ts)));

    /* Only a trace the feed carries is linked. Nothing here invents one. */
    if (typeof event.trace_url === "string" && event.trace_url) {
      var traceWrap = el("div", "act-trace");
      var link = el("a", null, "trace");
      link.href = event.trace_url;
      link.rel = "noopener noreferrer";
      traceWrap.appendChild(link);
      cell.appendChild(traceWrap);
    }

    if (effectEvent) { cell.appendChild(effectBlock(effectEvent)); }
  }

  /* ---------- judge cell ---------- */

  function renderJudge(cell, event) {
    clear(cell);
    cell.appendChild(el("div", "cell-lane", "judge"));

    if (!event) {
      cell.appendChild(el("div", "waiting", "waiting"));
      return;
    }

    var line = el("div", "verdict-line");
    var word = capitalize(displayWord(event.verdict));
    line.appendChild(el("span", "verdict", word));
    if (differsBeyondCasing(word, event.verdict)) {
      line.appendChild(el("span", "raw", String(event.verdict)));
    }
    cell.appendChild(line);

    if (event.reason) { cell.appendChild(el("div", "reason", event.reason)); }

    if (Array.isArray(event.evidence_refs) && event.evidence_refs.length) {
      cell.appendChild(el("div", "cites", "cites: " + event.evidence_refs.join(", ")));
    }

    if (event.reviewer_version) {
      cell.appendChild(el("div", "reviewer-version", String(event.reviewer_version)));
    }

    /* The runtime decided this on its own. It is a separate authority from the
       reviewer's recommendation, so it never shares a word with it, and when
       the feed carries no runtime decision the page says so rather than
       filling the gap. */
    var runtime = event.runtime;
    if (!runtime || runtime.decision === undefined || runtime.decision === null) {
      cell.appendChild(el("div", "runtime runtime-quiet", "runtime not consulted"));
      return;
    }

    var block = el("div", "runtime");
    var first = el("div");
    first.appendChild(el("span", "runtime-key", "runtime: "));
    first.appendChild(el("span", "runtime-word", displayWord(runtime.decision)));
    block.appendChild(first);
    if (Array.isArray(runtime.rule_ids) && runtime.rule_ids.length) {
      block.appendChild(el("div", "runtime-rules", "rules " + runtime.rule_ids.join(", ")));
    }
    cell.appendChild(block);
  }

  /* ---------- human cell ---------- */

  function renderHuman(cell, humanEvent, verdictEvent) {
    clear(cell);
    cell.className = "cell cell-human";
    cell.appendChild(el("div", "cell-lane", "human"));

    if (!humanEvent) {
      var runtime = (verdictEvent && verdictEvent.runtime) || {};
      if (runtime.decision === "needs_human") {
        cell.appendChild(el("div", "waiting", "waiting for human"));
      } else {
        /* No human was needed: hairline only, and never the word "n/a". */
        cell.className = "cell cell-human cell-quiet";
      }
      return;
    }

    cell.appendChild(el("div", "human-status", capitalize(displayWord(humanEvent.status))));

    /* The channel is printed as the feed wrote it. A fixture channel is a
       pre-authored answer, so it carries the simulated label. */
    var channelLine = el("div", "human-line");
    if (humanEvent.channel) {
      channelLine.appendChild(el("span", null, String(humanEvent.channel)));
      if (humanEvent.channel === "fixture") { channelLine.appendChild(chip("simulated")); }
    }
    if (humanEvent.request_id) {
      channelLine.appendChild(el("span", null, String(humanEvent.request_id)));
    }
    if (channelLine.childNodes.length) { cell.appendChild(channelLine); }

    if (humanEvent.decided_at) {
      cell.appendChild(el("div", "human-line", "decided " + String(humanEvent.decided_at)));
    }

    /* The source chip is not decoration: a simulated row is a stand-in, and a
       real decision only ever arrives from approval.md. */
    var holder = el("div", "human-chip");
    if (humanEvent.source === "approval_cli") {
      holder.appendChild(chip("approval_cli", "approval.md"));
    } else {
      holder.appendChild(chip(humanEvent.source));
    }
    cell.appendChild(holder);
  }

  /* ---------- rows ---------- */

  function resetGrid() {
    state.order.forEach(function (row) {
      if (row.wrapper.parentNode) { row.wrapper.parentNode.removeChild(row.wrapper); }
    });
    state.rows = {};
    state.order = [];
    state.firstRow = null;
    state.lastSeq = 0;
  }

  /* Rows run newest first, so row i sits under row i-1. A boundary between two
     episodes gets the heavier line; attempts inside one episode keep the
     hairline. */
  function restyleEpisodeBoundaries() {
    state.order.forEach(function (row, index) {
      var above = index > 0 ? state.order[index - 1] : null;
      var starts = Boolean(above && row.episodeId !== above.episodeId);
      row.wrapper.classList.toggle("row-ep-start", starts);
    });
  }

  function makeRow(actionId) {
    var wrapper = el("div", "feed-row");
    wrapper.style.display = "contents";
    wrapper.setAttribute("data-action-id", actionId);

    var row = {
      wrapper: wrapper,
      action: el("div", "cell cell-action"),
      judge: el("div", "cell cell-judge"),
      human: el("div", "cell cell-human"),
      actionEvent: null,
      verdictEvent: null,
      humanEvent: null,
      effectEvent: null,
      episodeId: null
    };
    wrapper.appendChild(row.action);
    wrapper.appendChild(row.judge);
    wrapper.appendChild(row.human);

    renderAction(row.action, null);
    renderJudge(row.judge, null);
    renderHuman(row.human, null, null);

    /* Newest at the top: insert ahead of the row inserted before this one,
       which puts it directly under the column headings. */
    feedEl.insertBefore(wrapper, state.firstRow);
    state.firstRow = wrapper;
    state.rows[actionId] = row;
    state.order.unshift(row);

    wrapper.classList.add("row-new");
    window.setTimeout(function () { wrapper.classList.remove("row-new"); }, 400);

    if (emptyEl) { emptyEl.hidden = true; }
    return row;
  }

  function rowFor(actionId) {
    return state.rows[actionId] || makeRow(actionId);
  }

  function previousArgsFor(event) {
    var previous = state.rows[event.revises];
    return previous && previous.actionEvent ? previous.actionEvent.args : null;
  }

  function redrawAction(row) {
    var event = row.actionEvent;
    renderAction(row.action, event, event ? previousArgsFor(event) : null, row.effectEvent);
  }

  function applyEvent(event) {
    if (!event || !event.action_id) { return; }
    var row = rowFor(event.action_id);

    if (event.episode_id && row.episodeId !== event.episode_id) {
      row.episodeId = String(event.episode_id);
      restyleEpisodeBoundaries();
    }

    if (event.kind === "action") {
      row.actionEvent = event;
      redrawAction(row);
    } else if (event.kind === "verdict") {
      row.verdictEvent = event;
      renderJudge(row.judge, event);
      renderHuman(row.human, row.humanEvent, event);
    } else if (event.kind === "human") {
      /* The latest human event for an action is the one that stands. */
      row.humanEvent = event;
      renderHuman(row.human, event, row.verdictEvent);
    } else if (event.kind === "effect") {
      row.effectEvent = event;
      redrawAction(row);
    }
  }

  /* ---------- status strip ---------- */

  function setMode(mode) {
    clear(modeValEl);
    modeValEl.appendChild(chip(mode));

    clear(syntheticEl);
    if (mode === "simulated") {
      syntheticEl.appendChild(chip("simulated", "synthetic feed"));
      syntheticEl.appendChild(el("span", null, "human rows marked simulated are stand-ins"));
      syntheticEl.hidden = false;
    } else {
      syntheticEl.hidden = true;
    }
  }

  function setPollState(text) {
    pollValEl.textContent = text;
  }

  function setUnreachable(reason) {
    unreachableDetailEl.textContent = reason;
    unreachableEl.hidden = false;
    setPollState("feed unreachable");
  }

  function clearUnreachable() {
    unreachableEl.hidden = true;
    if (!state.paused) { setPollState("polling every 1s"); }
  }

  /* ---------- fetch and apply ---------- */

  function apply(doc) {
    var events = Array.isArray(doc.events) ? doc.events.slice() : [];
    events.sort(function (a, b) { return Number(a.seq) - Number(b.seq); });

    var highest = events.length ? Number(events[events.length - 1].seq) : 0;
    if (doc.feed_id !== state.feedId || highest < state.lastSeq) {
      /* A different feed document, or one that restarted: start the grid over
         rather than interleaving two runs. */
      resetGrid();
      state.feedId = doc.feed_id;
    }

    events.forEach(function (event) {
      if (Number(event.seq) > state.lastSeq) { applyEvent(event); }
    });
    state.lastSeq = Math.max(state.lastSeq, highest);

    setMode(doc.mode);
    countValEl.textContent = String(events.length);
    lastValEl.textContent = events.length ? String(events[events.length - 1].ts) : "none yet";
    if (emptyEl) { emptyEl.hidden = events.length > 0; }
  }

  function poll() {
    return fetch(FEED_URL, { cache: "no-store" }).then(function (response) {
      if (!response.ok) {
        throw new Error("the server answered " + response.status + " " + response.statusText + ".");
      }
      return response.text();
    }).then(function (text) {
      var doc;
      try {
        doc = JSON.parse(text);
      } catch (err) {
        throw new Error("the file loaded but is not valid JSON: " + err.message);
      }
      apply(doc);
      clearUnreachable();
    }, function (err) {
      setUnreachable(FEED_URL + " could not be read: " + err.message);
    });
  }

  function schedule() {
    if (state.paused) { return; }
    state.timer = window.setTimeout(tick, POLL_MS);
  }

  function tick() {
    poll().then(schedule, schedule);
  }

  function setPaused(paused) {
    state.paused = paused;
    if (paused) {
      if (state.timer) { window.clearTimeout(state.timer); state.timer = null; }
      toggleEl.textContent = "Resume";
      setPollState("paused");
    } else {
      toggleEl.textContent = "Pause";
      if (unreachableEl.hidden) { setPollState("polling every 1s"); }
      tick();
    }
  }

  toggleEl.addEventListener("click", function () { setPaused(!state.paused); });

  function start() {
    setPollState("polling every 1s");
    tick();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();
</script>
</body>
</html>
