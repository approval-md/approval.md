<text class="ink t-small" x="56" y="712" font-weight="600">the bound on a patch is structural, not a line count</text>
<text class="muted t-small" x="56" y="734">one editable section, ## Adjustable guidance; every other byte of the reviewer prompt is frozen</text>
<text class="muted t-small" x="56" y="754">at most 25 changed lines · at most 1500 added characters · at most 200 characters per line</text>
<text class="muted t-small" x="56" y="774">ASCII only · no new headings · no approving, granting, tokens, bypassing, the gate</text>
