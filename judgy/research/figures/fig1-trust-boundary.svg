<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1131" viewBox="0 0 1600 1131" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="figtitle figdesc">
<title id="figtitle">Fig 1 — the trust boundary and the two loops</title>
<desc id="figdesc">Four authority lanes: the model recommends, the runtime authorizes, the human decides at the gate, and the effect lane records what happened. Below them the outer loop runs right to left: Weave traces, W&amp;B MCP retrieval, the improvement agent, one bounded prompt patch, the promotion gate and the active reviewer pointer. The patch bound is structural: one editable section, every other byte frozen. Policy, labels, permissions, the scorer and the gate itself sit in a hatched protected region and are digest-checked before and after every cycle.</desc>
