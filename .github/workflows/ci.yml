# CI — the gate, outside any agent's hands (APRV-37).
#
# The tier a change rides is computed here, by scripts/classify-tier.mjs, from
# the paths git reports. No input from the author of the change — commit
# message, label, task file, or agent claim — can select it. The two rules that
# make that true are in the classify job below:
#
#   1. a push to main is `full` unconditionally, without consulting anything;
#   2. every other event, merge-queue candidates included, asks the classifier,
#      which fails closed to `full`.
#
# The workflow references no secrets and needs none: it checks out public code,
# installs pinned dependencies, and runs the test matrix. Nothing here can send,
# spend, publish, or deploy, so there is nothing for a malicious pull request to
# steal by getting a workflow run.

name: ci

# Trigger split (human refinement, 2026-08-05): push covers main only, and
# pull_request owns PR branches. Before the restriction, a branch with an open
# PR ran the full gate twice per Node version on every push (push event plus
# pull_request event on the same commits). A branch with no PR gets no CI,
# which is fine: nothing merges without a PR, and the PR is where the gate is
# required.
#
# Classification input, stated so nobody re-litigates it from symptoms: the
# classifier diffs `base...HEAD` (three-dot, merge-base semantics), so a PR
# that pulls main in via "Update branch" is still classified from its own
# changes only. A record-only PR takes the `records` tier (APRV-112), which
# runs every test that reads records on the Node floor; if such a PR runs the
# full gate instead, some non-record path is in its diff, never merge-commit
# pollution.
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests candidate merges on temporary branches it creates,
  # and reports the required checks from runs on THIS event. Without it the
  # queue waits for a `ci` verdict that never arrives and times entries out
  # (observed 2026-08-20, first day of the queue).
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  classify:
    name: classify tier
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: tier
        name: compute tier from changed paths
        # Context values are passed as environment variables rather than
        # interpolated into the script text: a branch name is attacker-shaped
        # input, and it must not be able to become shell syntax.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Rule 1: push to main is always the full tier.
          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            echo "push to main: tier=full, unconditionally"
            echo "tier=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Rule 1b (APRV-128): a merge-queue candidate classifies its own
          # diff, exactly as a pull request does. It answered full
          # unconditionally when the queue landed; the refinement is bounded by
          # what the cheap tiers run. A records-only candidate takes the
          # records tier, which is precisely the set of tests that read what
          # changed, so nothing able to observe the candidate is skipped.
          # Anything else is the next main and gets the full gate, and a
          # classifier failure, an unknown word, or an unreadable git state
          # still resolves full below. The queue builds its candidate on a
          # temporary branch carrying the target branch's history plus the
          # entry's commits, and reports no base_ref (verified on a live
          # merge_group run, 2026-08-20), so the base is origin/main and
          # `origin/main...HEAD` is the candidate's own change set.
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            base="origin/$BASE_REF"
          else
            base="origin/main"
          fi
          tier="$(node scripts/classify-tier.mjs --base "$base")"
          case "$tier" in
            light|records|full) ;;
            *) tier=full ;;   # unrecognised output fails closed
          esac
          echo "base=$base tier=$tier"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
      - name: explain the verdict
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            echo '{"tier":"full","reason":"push-to-main"}'
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            base="origin/$BASE_REF"
          else
            base="origin/main"
          fi
          node scripts/classify-tier.mjs --base "$base" --json

  doc-guard:
    name: docs guard (light tier)
    needs: classify
    if: needs.classify.outputs.tier == 'light'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test dist/tests/docs-guard.test.js

  records:
    # The records tier (APRV-112): a change that touches only backlog/** and
    # MILESTONES.md runs every test that READS those records, on the Node floor
    # alone. The set is named in scripts/classify-tier.mjs (RECORDS_TESTS) and
    # passed through the same run-tests.mjs entry the full suite uses, which
    # fails hard when a named test file is missing rather than running a
    # smaller suite. Node 20 because the floor is the version nobody develops
    # on, and a record cannot break a version-sensitive path.
    name: records guards (records tier)
    needs: classify
    if: needs.classify.outputs.tier == 'records'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/run-tests.mjs --only milestones-guard backlog-fixtures docs-guard

  protected-paths:
    # The fail-closed backstop for protected-path writes that bypassed the
    # harness hook (APRV-151). Two incidents — 2026-08-29 SPEC.md in worktree
    # aprv-145-land, 2026-08-30 this very file in agent-a3f5d255372d43ac0 —
    # applied in spawned-agent worktrees with no prompt, no denial, and no
    # refused-request record. An action that bypasses the hook writes nothing to
    # the log, so nothing in-session can report the gap; the only surviving
    # signal is the ABSENCE of a grant. This job reads that absence.
    #
    # It never asks a session whether it was hooked. It asks git which protected
    # paths changed and requires, for each, evidence in the committed
    # hash-chained log that a human decided it. Session wiring is not an input.
    #
    # It runs on every event and every tier, deliberately: a tier says how much
    # test suite a change needs, and this says whether a change was consented
    # to. fetch-depth 0 because the guard reads blobs at two commits.
    name: protected paths (grant cross-check)
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: fetch the records branches the guard may read
        # The log at this head is main's log at branch time and trails the
        # primary checkout's live log, so a grant tapped during the session
        # reaches a committed log only when an advance lands (APRV-260). The
        # guard therefore reads the freshest committed copy that carries THIS
        # head's own chain, and those copies live on `records-*` branches.
        # `fetch-depth: 0` already brings them; this makes the dependency
        # explicit rather than resting on checkout's default refspec, and it
        # names no untrusted context value at all.
        run: git fetch --no-tags origin '+refs/heads/records-*:refs/remotes/origin/records-*'
      - name: cross-check protected paths against the committed log
        # Context values reach the script as environment variables and are never
        # interpolated into its text, for the reason the classify job states: a
        # branch name is attacker-shaped input and must not become shell syntax.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            target="origin/$BASE_REF"
          else
            target="origin/main"
          fi
          base="$(git merge-base "$target" HEAD)"
          echo "base=$base head=$(git rev-parse HEAD)"
          # The guard's first line says which committed copy of the log it read
          # and how far past head that copy reaches; it is repeated into the job
          # summary so a reader can tell a stale log from a missing grant
          # without opening the log.
          node scripts/protected-path-guard.mjs --base "$base" --head HEAD | tee "$RUNNER_TEMP/guard.txt"
          # The summary line is informational: the guard's exit status above is
          # the verdict, and a missing line must not turn a required check red.
          grep '^log from ' "$RUNNER_TEMP/guard.txt" >> "$GITHUB_STEP_SUMMARY" || true

  overlay-recipes:
    # The consumer corpus (0.4.7, EDGEOS-BLOCK). Core 0.4.6's
    # `fetch-output-unknown` rule was right, and it classed every EdgeOS curl
    # recipe the overlay ships `policy.core`, which the overlay's template
    # reserves to humans: from the morning the boxes took 0.4.6 every EdgeOS
    # call was denied outright, and nobody had run the fleet's own recipes
    # through the new classifier. This job does, on every change: the pinned
    # snapshot of the overlay's shipped recipes (scripts/overlay-recipes/
    # corpus.json, with the overlay sha it came from) goes through
    # `classifyForHook` as built here, and any recipe that resolves to a
    # human-only class under the overlay's template policy fails the job unless
    # scripts/overlay-recipes/allowlist.json lists it with a reason.
    #
    # Every event and every tier, as protected-paths runs: it is cheap, and the
    # tag is cut from a main this job has passed on.
    #
    # CLASS-DIFF and box check (B-167, lead ruling CLAIMS L15681 (1); fold 1
    # after review-b's refute). Every shipped call goes through the REAL
    # `approval hook hermes` of this build and of BASELINE_CORE (the core the
    # boxes run: the control plane's APPROVAL_MD_VERSION; move this pin in the
    # PR that follows a roll), each in a box layout (HOME/.hermes with a dummy
    # `.env`, `config.yaml`, the overlay's skills and workspace,
    # APPROVAL_HERMES_HOME set as the control plane sets it, an attested
    # store): recipes as terminal calls at $HERMES_HOME, $HOME,
    # $HERMES_HOME/workspace and unset, harness calls as Hermes tool envelopes
    # (core's own tools and every tools: line). It fails when:
    # - a shipped recipe is denied by the hook in the box (human-only or
    #   refused) and the allowlist does not list it with Carter's acceptance;
    # - an existing call loses autonomy or stops running between the two cores
    #   (auto -> card, autonomous -> supervised-retro, a higher live rate, and
    #   every move into a deny), unless accepted by name;
    # - a tools line is newly shadowed by an earlier one (first match wins).
    # The report is the job summary and the `class-diff` artifact (markdown +
    # JSON); its first line is the GATE line.
    #
    # No self-bypass (fold 1 M-3): the gate's own files (the corpus, the
    # allowlist, the check, the box runner, the extractor) are pinned here by
    # sha256, and the corpus by its recipe count, so changing any of them is
    # a change to this workflow, a protected path (policy.edit.ci) that needs
    # Carter's grant or attest. The corpus is re-extracted from the overlay at
    # its pinned sha with the BASE branch's extractor, not this PR's.
    #
    # NEW-CALLS (B-167N, APRV-534): scripts/overlay-recipes-newcalls.mjs, pinned
    # here like the other gate files. It runs when the overlay's class-diff job
    # passes --expected (the overlay's expected.json) and --tag-corpus; this
    # job's pinned corpus carries no envelopes, so it does not run it here.
    # scripts/overlay-recipes/expected.json is the overlay's expected.json, byte
    # for byte, pinned here like the allowlist (PIN_EXPECTED): the check refuses
    # an overlay expected.json that is not this copy, so a changed declaration
    # (an acceptance by human:carter included) lands here first.
    name: overlay recipes (consumer corpus)
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    env:
      BASELINE_CORE: "0.4.7"
      BASELINE_CORE_INTEGRITY: "sha512-HksuK9n/+lUQqW6g/7PU4iM7V50Ttp3wtdiioQJr1j2ZOvWyT9C5VgN6PGL9ULUTM5j/2EAsKa2BBizJYdTEUg=="
      CORPUS_RECIPES: "63"
      PIN_CORPUS: "069cae876367a6c65613a645bbece0212583dde3d6e186454d5d4a9f287cb1c4"
      PIN_ALLOWLIST: "408a7e3b6b0f86900e7e3b94cd724445a84910580316d2a1c718074adb4f526d"
      PIN_EXPECTED: "7a8e35c3959f3930426c8f99d2299da10dd3584dabff156b3124d3702ab74fb2"
      PIN_CHECK: "268e6d046c26e4078d4f2d2bd2e5db1e1877e76b68b8ba06383e8af8cb750289"
      PIN_BOX: "ae87d7be0e0bd143071eda27c120356dcc18764a120e595e06513a25ffacd3e6"
      PIN_EXTRACT: "d68b77e7831f400e3cede4da6e7fa82ece4ec740983ee743e2f1db9796a3104c"
      PIN_NEWCALLS: "6752bd813990be06de79a7068ed1f540640437d002ce93ac1808da53052241d1"
    steps:
      # Depth 2: HEAD^1 is the base the change is measured against (a pull
      # request's merge commit's first parent, the queue's base, or the main a
      # push moved from), read from git rather than from event text.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: the gate's own files are the ones this workflow pins
        run: |
          set -euo pipefail
          bad=0
          pin() {
            got=$(sha256sum "$1" | cut -d' ' -f1)
            if [ "$got" != "$2" ]; then
              echo "::error::$1 has sha256 $got, not the $2 this workflow pins: a change to the gate's own files is a change to ci.yml (protected, Carter's grant)"
              bad=1
            fi
          }
          pin scripts/overlay-recipes/corpus.json "$PIN_CORPUS"
          pin scripts/overlay-recipes/allowlist.json "$PIN_ALLOWLIST"
          pin scripts/overlay-recipes/expected.json "$PIN_EXPECTED"
          pin scripts/overlay-recipes-check.mjs "$PIN_CHECK"
          pin scripts/overlay-recipes-box.mjs "$PIN_BOX"
          pin scripts/overlay-recipes-extract.mjs "$PIN_EXTRACT"
          pin scripts/overlay-recipes-newcalls.mjs "$PIN_NEWCALLS"
          n=$(node -p 'require("./scripts/overlay-recipes/corpus.json").recipes.length')
          if [ "$n" != "$CORPUS_RECIPES" ]; then
            echo "::error::the corpus holds $n recipes, not the $CORPUS_RECIPES this workflow pins"
            bad=1
          fi
          exit $bad
      - name: overlay sha the corpus pins
        id: pin
        run: echo "sha=$(node -p 'require("./scripts/overlay-recipes/corpus.json").overlay.sha')" >> "$GITHUB_OUTPUT"
      - name: check out the overlay at the pinned sha
        uses: actions/checkout@v4
        with:
          repository: Edge-City/agentvillage
          ref: ${{ steps.pin.outputs.sha }}
          path: .overlay
          persist-credentials: false
          sparse-checkout: |
            skills
            workspace
            install
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: the committed corpus is the overlay's own extraction at that sha (base branch's extractor)
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/base-extractor"
          mkdir -p "$tools/scripts"
          extractor=scripts/overlay-recipes-extract.mjs
          BASE_SHA=$(git rev-parse --verify --quiet HEAD^1 || true)
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:scripts/overlay-recipes-extract.mjs" 2>/dev/null; then
            git show "$BASE_SHA:scripts/overlay-recipes-extract.mjs" > "$tools/scripts/overlay-recipes-extract.mjs"
            extractor="$tools/scripts/overlay-recipes-extract.mjs"
            echo "extracting with the base branch's extractor ($BASE_SHA)"
          else
            echo "::notice::no extractor at the base (${BASE_SHA:-none}); extracting with this checkout's, which the sha256 pin above holds"
          fi
          at=$(node -p 'require("./scripts/overlay-recipes/corpus.json").overlay.extracted_at')
          bun "$extractor" --overlay "$GITHUB_WORKSPACE/.overlay" --sha "${{ steps.pin.outputs.sha }}" --extracted-at "$at" --out "$RUNNER_TEMP/corpus.json"
          if ! cmp -s "$RUNNER_TEMP/corpus.json" scripts/overlay-recipes/corpus.json; then
            echo "::error::scripts/overlay-recipes/corpus.json differs from a fresh extraction of the overlay at ${{ steps.pin.outputs.sha }}; refresh it with the extractor, never by hand"
            diff <(node -p 'JSON.stringify(require(process.argv[1]).recipes,null,1)' "$RUNNER_TEMP/corpus.json") <(node -p 'JSON.stringify(require(process.argv[1]).recipes,null,1)' "$PWD/scripts/overlay-recipes/corpus.json") | head -40 || true
            exit 1
          fi
      - name: install the baseline core (the boxes' pin) from npm
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/baseline"
          mkdir -p "$dir"
          echo '{"name":"baseline-core","private":true}' > "$dir/package.json"
          (cd "$dir" && npm install --no-audit --no-fund --ignore-scripts "approval-md@$BASELINE_CORE")
          got=$(node -p 'const p = require(process.argv[1]).packages; p[Object.keys(p).find((k) => k.endsWith("node_modules/approval-md"))].integrity' "$dir/package-lock.json")
          if [ "$got" != "$BASELINE_CORE_INTEGRITY" ]; then
            echo "::error::approval-md@$BASELINE_CORE integrity $got is not the pinned $BASELINE_CORE_INTEGRITY"
            exit 1
          fi
      - name: corpus check + box check + CLASS-DIFF against the baseline core
        env:
          SHA: ${{ github.sha }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/boxes"
          node scripts/overlay-recipes-check.mjs \
            --overlay-tree "$GITHUB_WORKSPACE/.overlay" --box-root "$RUNNER_TEMP/boxes" --box-concurrency 4 \
            --diff "$RUNNER_TEMP/baseline/node_modules/approval-md" \
            --baseline-label "npm approval-md@$BASELINE_CORE, the boxes' pin" \
            --core-label "this build ${SHA:0:12}" \
            --md class-diff.md --diff-json class-diff.json
          status=$?
          if [ -f class-diff.md ]; then cat class-diff.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit $status
      - name: upload the class-diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-diff
          path: |
            class-diff.md
            class-diff.json
          if-no-files-found: warn

  full:
    # The full gate's bulk, sharded (APRV-149). Three jobs run a third of the
    # suite each, so the tier's wall clock is the slowest shard rather than one
    # `node --test` pool on two runner cores. The assignment lives in
    # scripts/run-tests.mjs: the file at sorted position i belongs to shard
    # (i mod 3) + 1, so every discovered file is in exactly one shard and the
    # matrix covers all of them. The runner refuses an out-of-range index or an
    # empty shard rather than exiting green over a slice nothing ran.
    #
    # One compile per job. The build step compiles and the runner runs what it
    # built; `npm test` would compile a second time and `npm run typecheck` a
    # third, and neither pass can fail where the build passed. `npm test` keeps
    # its build-then-run shape for humans, who have not already built.
    #
    # Lint runs in every shard on purpose. oxlint takes about a second on this
    # tree, and a shard that lints is a complete verdict on what it built
    # instead of a job whose meaning depends on a sibling.
    name: full gate (node 22, shard ${{ matrix.shard }}/3)
    needs: classify
    if: needs.classify.outputs.tier == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/run-tests.mjs --shard ${{ matrix.shard }}/3
      - run: npm run lint

  full-floor:
    # The Node floor, proven where it decides something (APRV-149).
    # `engines.node` is >=20 and the floor is the version nobody develops on,
    # so it stays in the gate; what changed is when it runs. A pull_request run
    # is feedback for an author, and the merge-queue candidate is what stands
    # between a change and main, so the floor runs on the queue and on a push
    # to main. A pull request no longer waits for a second whole suite to
    # repeat what the shards above already said, and nothing becomes main
    # without the floor having run on it.
    #
    # Sharded three ways as well (APRV-159), and it compiles once as the shards
    # do. The floor still proves everything before main: run-tests.mjs assigns
    # each discovered file to exactly one shard, so the three legs together are
    # the whole suite and only the wall clock changed. Unsharded, the floor was
    # the merge-queue candidate's long pole at 11 to 14.5 minutes, one
    # `node --test` pool on two runner cores still grinding after the Node 22
    # shards had finished. The aggregator below needs no change for this:
    # GitHub reports one result for a matrix job and it is `success` only when
    # every shard succeeded, so `needs['full-floor'].result` answers the
    # FLOOR_REQUIRED question exactly as it did when the leg was a single job.
    # No lint step: oxlint's verdict does not vary by Node major, and every
    # shard above already has it.
    name: full gate (node 20 floor, shard ${{ matrix.shard }}/3)
    needs: classify
    if: >-
      needs.classify.outputs.tier == 'full' &&
      (github.event_name == 'merge_group' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/run-tests.mjs --shard ${{ matrix.shard }}/3

  ci:
    # The one required check. `classify` alone passes regardless of tier
    # outcome, so branch protection requiring it would protect nothing; this
    # job succeeds only when the tier that was chosen actually ran and
    # succeeded. Skipped-when-required is a failure here, not a pass.
    #
    # `full` is the whole shard matrix: GitHub reports one result for a matrix
    # job and it is `success` only when every shard succeeded, so requiring
    # that result requires all three. The floor leg is conditional (APRV-149),
    # so this job decides which events owe a floor result rather than letting a
    # skipped job read as a pass on the events that must prove the floor.
    name: ci
    needs: [classify, doc-guard, records, full, full-floor, protected-paths, overlay-recipes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate tier outcomes
        env:
          TIER: ${{ needs.classify.outputs.tier }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOC_RESULT: ${{ needs['doc-guard'].result }}
          RECORDS_RESULT: ${{ needs.records.result }}
          FULL_RESULT: ${{ needs.full.result }}
          FULL_FLOOR_RESULT: ${{ needs['full-floor'].result }}
          PROTECTED_RESULT: ${{ needs['protected-paths'].result }}
          OVERLAY_RESULT: ${{ needs['overlay-recipes'].result }}
          FLOOR_REQUIRED: ${{ github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: |
          set -euo pipefail
          echo "classify=$CLASSIFY_RESULT tier=$TIER doc-guard=$DOC_RESULT records=$RECORDS_RESULT full=$FULL_RESULT full-floor=$FULL_FLOOR_RESULT floor-required=$FLOOR_REQUIRED protected-paths=$PROTECTED_RESULT overlay-recipes=$OVERLAY_RESULT"
          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "classify did not succeed; nothing downstream is trustworthy"
            exit 1
          fi
          if [ "$PROTECTED_RESULT" != "success" ]; then
            echo "the protected-path grant cross-check did not succeed ($PROTECTED_RESULT); a protected path changed with no evidence in the committed log that a human decided it"
            exit 1
          fi
          if [ "$OVERLAY_RESULT" != "success" ]; then
            echo "the overlay recipe corpus check did not succeed ($OVERLAY_RESULT); an overlay recipe resolves to a human-only class under this core and is not allowlisted, a shipped call flips from running to a deny against the boxes' core (CLASS-DIFF, B-167), or the corpus is not the overlay's own extraction (EDGEOS-BLOCK)"
            exit 1
          fi
          case "$TIER" in
            light)
              [ "$DOC_RESULT" = "success" ] || { echo "light tier required doc-guard to succeed, got $DOC_RESULT"; exit 1; }
              ;;
            records)
              [ "$RECORDS_RESULT" = "success" ] || { echo "records tier required the records guards to succeed, got $RECORDS_RESULT"; exit 1; }
              ;;
            full)
              [ "$FULL_RESULT" = "success" ] || { echo "full tier required every shard of the full gate to succeed, got $FULL_RESULT"; exit 1; }
              if [ "$FLOOR_REQUIRED" = "true" ]; then
                [ "$FULL_FLOOR_RESULT" = "success" ] || { echo "this event must prove the Node 20 floor before anything becomes main, got $FULL_FLOOR_RESULT"; exit 1; }
              else
                [ "$FULL_FLOOR_RESULT" = "skipped" ] || [ "$FULL_FLOOR_RESULT" = "success" ] || { echo "the Node 20 floor leg neither was skipped nor succeeded on an event that does not require it, got $FULL_FLOOR_RESULT"; exit 1; }
              fi
              ;;
            *)
              echo "unrecognized tier '$TIER'"
              exit 1
              ;;
          esac
          echo "the active tier succeeded"
