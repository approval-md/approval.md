# CI — the gate, outside any agent's hands (APRV-37).
#
# The tier a change rides is computed here, by scripts/classify-tier.mjs, from
# the paths git reports. No input from the author of the change — commit
# message, label, task file, or agent claim — can select it. The two rules that
# make that true are in the classify job below:
#
#   1. a push to main is `full` unconditionally, without consulting anything;
#   2. every other event, merge-queue candidates included, asks the classifier,
#      which fails closed to `full`.
#
# The workflow references no secrets and needs none: it checks out public code,
# installs pinned dependencies, and runs the test matrix. Nothing here can send,
# spend, publish, or deploy, so there is nothing for a malicious pull request to
# steal by getting a workflow run.

name: ci

# Trigger split (human refinement, 2026-08-05): push covers main only, and
# pull_request owns PR branches. Before the restriction, a branch with an open
# PR ran the full gate twice per Node version on every push (push event plus
# pull_request event on the same commits). A branch with no PR gets no CI,
# which is fine: nothing merges without a PR, and the PR is where the gate is
# required.
#
# Classification input, stated so nobody re-litigates it from symptoms: the
# classifier diffs `base...HEAD` (three-dot, merge-base semantics), so a PR
# that pulls main in via "Update branch" is still classified from its own
# changes only. A record-only PR takes the `records` tier (APRV-112), which
# runs every test that reads records on the Node floor; if such a PR runs the
# full gate instead, some non-record path is in its diff, never merge-commit
# pollution.
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests candidate merges on temporary branches it creates,
  # and reports the required checks from runs on THIS event. Without it the
  # queue waits for a `ci` verdict that never arrives and times entries out
  # (observed 2026-08-20, first day of the queue).
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  classify:
    name: classify tier
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: tier
        name: compute tier from changed paths
        # Context values are passed as environment variables rather than
        # interpolated into the script text: a branch name is attacker-shaped
        # input, and it must not be able to become shell syntax.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Rule 1: push to main is always the full tier.
          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            echo "push to main: tier=full, unconditionally"
            echo "tier=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Rule 1b (APRV-128): a merge-queue candidate classifies its own
          # diff, exactly as a pull request does. It answered full
          # unconditionally when the queue landed; the refinement is bounded by
          # what the cheap tiers run. A records-only candidate takes the
          # records tier, which is precisely the set of tests that read what
          # changed, so nothing able to observe the candidate is skipped.
          # Anything else is the next main and gets the full gate, and a
          # classifier failure, an unknown word, or an unreadable git state
          # still resolves full below. The queue builds its candidate on a
          # temporary branch carrying the target branch's history plus the
          # entry's commits, and reports no base_ref (verified on a live
          # merge_group run, 2026-08-20), so the base is origin/main and
          # `origin/main...HEAD` is the candidate's own change set.
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            base="origin/$BASE_REF"
          else
            base="origin/main"
          fi
          tier="$(node scripts/classify-tier.mjs --base "$base")"
          case "$tier" in
            light|records|full) ;;
            *) tier=full ;;   # unrecognised output fails closed
          esac
          echo "base=$base tier=$tier"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
      - name: explain the verdict
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            echo '{"tier":"full","reason":"push-to-main"}'
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            base="origin/$BASE_REF"
          else
            base="origin/main"
          fi
          node scripts/classify-tier.mjs --base "$base" --json

  doc-guard:
    name: docs guard (light tier)
    needs: classify
    if: needs.classify.outputs.tier == 'light'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test dist/tests/docs-guard.test.js

  records:
    # The records tier (APRV-112): a change that touches only backlog/** and
    # MILESTONES.md runs every test that READS those records, on the Node floor
    # alone. The set is named in scripts/classify-tier.mjs (RECORDS_TESTS) and
    # passed through the same run-tests.mjs entry the full suite uses, which
    # fails hard when a named test file is missing rather than running a
    # smaller suite. Node 20 because the floor is the version nobody develops
    # on, and a record cannot break a version-sensitive path.
    name: records guards (records tier)
    needs: classify
    if: needs.classify.outputs.tier == 'records'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/run-tests.mjs --only milestones-guard backlog-fixtures docs-guard

  protected-paths:
    # The fail-closed backstop for protected-path writes that bypassed the
    # harness hook (APRV-151). Two incidents — 2026-08-29 SPEC.md in worktree
    # aprv-145-land, 2026-08-30 this very file in agent-a3f5d255372d43ac0 —
    # applied in spawned-agent worktrees with no prompt, no denial, and no
    # refused-request record. An action that bypasses the hook writes nothing to
    # the log, so nothing in-session can report the gap; the only surviving
    # signal is the ABSENCE of a grant. This job reads that absence.
    #
    # It never asks a session whether it was hooked. It asks git which protected
    # paths changed and requires, for each, evidence in the committed
    # hash-chained log that a human decided it. Session wiring is not an input.
    #
    # It runs on every event and every tier, deliberately: a tier says how much
    # test suite a change needs, and this says whether a change was consented
    # to. fetch-depth 0 because the guard reads blobs at two commits.
    name: protected paths (grant cross-check)
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: cross-check protected paths against the committed log
        # Context values reach the script as environment variables and are never
        # interpolated into its text, for the reason the classify job states: a
        # branch name is attacker-shaped input and must not become shell syntax.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            target="origin/$BASE_REF"
          else
            target="origin/main"
          fi
          base="$(git merge-base "$target" HEAD)"
          echo "base=$base head=$(git rev-parse HEAD)"
          node scripts/protected-path-guard.mjs --base "$base" --head HEAD

  full:
    # The full gate's bulk, sharded (APRV-149). Three jobs run a third of the
    # suite each, so the tier's wall clock is the slowest shard rather than one
    # `node --test` pool on two runner cores. The assignment lives in
    # scripts/run-tests.mjs: the file at sorted position i belongs to shard
    # (i mod 3) + 1, so every discovered file is in exactly one shard and the
    # matrix covers all of them. The runner refuses an out-of-range index or an
    # empty shard rather than exiting green over a slice nothing ran.
    #
    # One compile per job. The build step compiles and the runner runs what it
    # built; `npm test` would compile a second time and `npm run typecheck` a
    # third, and neither pass can fail where the build passed. `npm test` keeps
    # its build-then-run shape for humans, who have not already built.
    #
    # Lint runs in every shard on purpose. oxlint takes about a second on this
    # tree, and a shard that lints is a complete verdict on what it built
    # instead of a job whose meaning depends on a sibling.
    name: full gate (node 22, shard ${{ matrix.shard }}/3)
    needs: classify
    if: needs.classify.outputs.tier == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/run-tests.mjs --shard ${{ matrix.shard }}/3
      - run: npm run lint

  full-floor:
    # The Node floor, proven where it decides something (APRV-149).
    # `engines.node` is >=20 and the floor is the version nobody develops on,
    # so it stays in the gate; what changed is when it runs. A pull_request run
    # is feedback for an author, and the merge-queue candidate is what stands
    # between a change and main, so the floor runs on the queue and on a push
    # to main. A pull request no longer waits for a second whole suite to
    # repeat what the shards above already said, and nothing becomes main
    # without the floor having run on it.
    #
    # Sharded three ways as well (APRV-159), and it compiles once as the shards
    # do. The floor still proves everything before main: run-tests.mjs assigns
    # each discovered file to exactly one shard, so the three legs together are
    # the whole suite and only the wall clock changed. Unsharded, the floor was
    # the merge-queue candidate's long pole at 11 to 14.5 minutes, one
    # `node --test` pool on two runner cores still grinding after the Node 22
    # shards had finished. The aggregator below needs no change for this:
    # GitHub reports one result for a matrix job and it is `success` only when
    # every shard succeeded, so `needs['full-floor'].result` answers the
    # FLOOR_REQUIRED question exactly as it did when the leg was a single job.
    # No lint step: oxlint's verdict does not vary by Node major, and every
    # shard above already has it.
    name: full gate (node 20 floor, shard ${{ matrix.shard }}/3)
    needs: classify
    if: >-
      needs.classify.outputs.tier == 'full' &&
      (github.event_name == 'merge_group' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/run-tests.mjs --shard ${{ matrix.shard }}/3

  ci:
    # The one required check. `classify` alone passes regardless of tier
    # outcome, so branch protection requiring it would protect nothing; this
    # job succeeds only when the tier that was chosen actually ran and
    # succeeded. Skipped-when-required is a failure here, not a pass.
    #
    # `full` is the whole shard matrix: GitHub reports one result for a matrix
    # job and it is `success` only when every shard succeeded, so requiring
    # that result requires all three. The floor leg is conditional (APRV-149),
    # so this job decides which events owe a floor result rather than letting a
    # skipped job read as a pass on the events that must prove the floor.
    name: ci
    needs: [classify, doc-guard, records, full, full-floor, protected-paths]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate tier outcomes
        env:
          TIER: ${{ needs.classify.outputs.tier }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOC_RESULT: ${{ needs['doc-guard'].result }}
          RECORDS_RESULT: ${{ needs.records.result }}
          FULL_RESULT: ${{ needs.full.result }}
          FULL_FLOOR_RESULT: ${{ needs['full-floor'].result }}
          PROTECTED_RESULT: ${{ needs['protected-paths'].result }}
          FLOOR_REQUIRED: ${{ github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: |
          set -euo pipefail
          echo "classify=$CLASSIFY_RESULT tier=$TIER doc-guard=$DOC_RESULT records=$RECORDS_RESULT full=$FULL_RESULT full-floor=$FULL_FLOOR_RESULT floor-required=$FLOOR_REQUIRED protected-paths=$PROTECTED_RESULT"
          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "classify did not succeed; nothing downstream is trustworthy"
            exit 1
          fi
          if [ "$PROTECTED_RESULT" != "success" ]; then
            echo "the protected-path grant cross-check did not succeed ($PROTECTED_RESULT); a protected path changed with no evidence in the committed log that a human decided it"
            exit 1
          fi
          case "$TIER" in
            light)
              [ "$DOC_RESULT" = "success" ] || { echo "light tier required doc-guard to succeed, got $DOC_RESULT"; exit 1; }
              ;;
            records)
              [ "$RECORDS_RESULT" = "success" ] || { echo "records tier required the records guards to succeed, got $RECORDS_RESULT"; exit 1; }
              ;;
            full)
              [ "$FULL_RESULT" = "success" ] || { echo "full tier required every shard of the full gate to succeed, got $FULL_RESULT"; exit 1; }
              if [ "$FLOOR_REQUIRED" = "true" ]; then
                [ "$FULL_FLOOR_RESULT" = "success" ] || { echo "this event must prove the Node 20 floor before anything becomes main, got $FULL_FLOOR_RESULT"; exit 1; }
              else
                [ "$FULL_FLOOR_RESULT" = "skipped" ] || [ "$FULL_FLOOR_RESULT" = "success" ] || { echo "the Node 20 floor leg neither was skipped nor succeeded on an event that does not require it, got $FULL_FLOOR_RESULT"; exit 1; }
              fi
              ;;
            *)
              echo "unrecognized tier '$TIER'"
              exit 1
              ;;
          esac
          echo "the active tier succeeded"
